const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const TAX_DEF={coef:0.0979,coefEneFeb:0.3446,isrRate:0.30,ivaRate:0.16,retISR:0.10,retIVA:2/3*0.16};
const TIPOS={
  SAT:{label:'SAT',iva:false,retISR:false,retIVA:false},
  SERV_PROF:{label:'Servicio Profesional',iva:true,retISR:true,retIVA:true},
  ARRENDAMIENTO:{label:'Arrendamiento',iva:true,retISR:true,retIVA:true},
  TRASPASO:{label:'Traspaso',iva:false,retISR:false,retIVA:false},
  PRESTAMO:{label:'Préstamo',iva:false,retISR:false,retIVA:false},
  NOMINA:{label:'Nómina',iva:false,retISR:false,retIVA:false},
  GASTO_ADM:{label:'Gasto Administrativo',iva:true,retISR:false,retIVA:false},
  COMPRA:{label:'Compra',iva:true,retISR:false,retIVA:false},
  OTRO:{label:'Otro',iva:false,retISR:false,retIVA:false},
};
const num=v=>parseFloat(v)||0;
const mxn=n=>Math.round(n||0).toLocaleString('es-MX',{maximumFractionDigits:0});
const getM=f=>{if(!f)return -1;const iso=String(f).match(/^(\d{4})-(\d{2})-(\d{2})/);if(iso)return parseInt(iso[2],10)-1;const d=new Date(f);return isNaN(d)?-1:d.getMonth();};
const uid=()=>`${Date.now()}${Math.random().toString(36).slice(2,6)}`;
const dupKey=r=>`${(r.fecha||'').slice(0,10)}|${(r.rfc||'').trim().toUpperCase()}|${num(r.total).toFixed(2)}`;
const bankDupKey=r=>`${(r.fecha||'').slice(0,10)}|${num(r.retiros).toFixed(2)}|${num(r.depositos).toFixed(2)}`;
const xlsDate=v=>{
  if(v==null||v==='')return '';
  if(typeof v==='number'){const d=new Date(Date.UTC(1899,11,30)+v*86400000);return d.toISOString().slice(0,10);}
  if(v instanceof Date)return v.toISOString().slice(0,10);
  const s=String(v).trim();
  const iso=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(iso)return iso[0];
  const d=new Date(s);
  return isNaN(d)?s:d.toISOString().slice(0,10);
};

function computeFiscal(ing,eg,cfg={},banco=[]){
  const c={...TAX_DEF,...cfg};
  const ingAC=ing.filter(x=>isConciliado(x,'ingreso',banco));
  const egAC=eg.filter(x=>isConciliado(x,'egreso',banco));
  let isrAcum=0;
  const isrMeses=MESES.map((mes,i)=>{
    const ingNom=ingAC.filter(x=>getM(x.fecha)===i).reduce((s,x)=>s+num(x.subtotal),0);
    const ingA=ingAC.filter(x=>getM(x.fecha)>=0&&getM(x.fecha)<=i).reduce((s,x)=>s+num(x.subtotal),0);
    const coef=i<2?c.coefEneFeb:c.coef;
    const util=ingA*coef;
    const isrP=util*c.isrRate;
    const ppA=isrAcum;
    const isrM=Math.max(0,isrP-isrAcum);
    if(isrM>0)isrAcum+=isrM;
    return{mes,i,ingNom,ingA,coef,util,isrP,ppA,isrM};
  });
  const ivaAcredArr=cfg.ivaAcred||[];
  const ivaMeses=MESES.map((mes,i)=>{
    const ivaCaus=ingAC.filter(x=>getM(x.fecha)===i).reduce((s,x)=>s+num(x.iva),0);
    const ivaAcr=egAC.filter(e=>getM(e.fecha)===i&&TIPOS[e.tipo]?.iva).reduce((s,e)=>s+num(e.iva),0);
    const retH=egAC.filter(e=>getM(e.fecha)===i&&TIPOS[e.tipo]?.retIVA).reduce((s,e)=>s+num(e.retIVA),0);
    // Otras cantidades a cargo = IVA retenido propio; a favor = mismo (netean). Acreditamiento manual = saldo a favor periodos anteriores
    const acredSF=num(ivaAcredArr[i]);
    const cantidadCargo=ivaCaus-ivaAcr; // 133-137 (otras a cargo/favor netean)
    const aPagar=Math.max(0,cantidadCargo-acredSF);
    return{mes,i,ivaCaus,ivaAcr,retH,acredSF,cantidadCargo,neto:cantidadCargo,aPagar,sfN:Math.max(0,acredSF-cantidadCargo)};
  });
  const retISRr=egAC.filter(e=>TIPOS[e.tipo]?.retISR).sort((a,b)=>new Date(a.fecha)-new Date(b.fecha));
  const retIVAr=egAC.filter(e=>TIPOS[e.tipo]?.retIVA).sort((a,b)=>new Date(a.fecha)-new Date(b.fecha));
  const dash={
    isrTotal:isrMeses.reduce((s,m)=>s+m.isrM,0),
    ivaTotal:ivaMeses.reduce((s,m)=>s+m.aPagar,0),
    ivaCaus:ivaMeses.reduce((s,m)=>s+m.ivaCaus,0),
    ivaAcr:ivaMeses.reduce((s,m)=>s+m.ivaAcr,0),
    retISR:retISRr.reduce((s,r)=>s+num(r.retISR),0),
    retIVA:retIVAr.reduce((s,r)=>s+num(r.retIVA),0),
    sfIVA:ivaMeses.reduce((s,m)=>s+m.sfN,0),
  };
  dash.total=dash.isrTotal+dash.ivaTotal+dash.retISR+dash.retIVA;
  return{isrMeses,ivaMeses,retISRr,retIVAr,dash};
}

function computeISRVertical(ing,inversion,cfg,isrAdj,banco){
  const ingAC=ing.filter(x=>isConciliado(x,'ingreso',banco));
  const adjAt=(i,k)=>num((isrAdj[i]||{})[k]);
  let prevNom=0,maxPer=0,accPTU=0,accAnt=0,accPerd=0,accRet=0;
  const months=MESES.map((mes,i)=>{
    const r8=adjAt(i,'enajBienes'),r9=adjAt(i,'prestServ');
    const r10=ingAC.filter(x=>getM(x.fecha)===i).reduce((s,x)=>s+num(x.subtotal),0);
    const r11=adjAt(i,'anticipCli');
    const r12=inversion.filter(x=>getM(x.fecha)===i).reduce((s,x)=>s+num(x.rendimiento),0);
    const r13=adjAt(i,'utilCambiaria'),r14=adjAt(i,'gananciaEnaj'),r15=adjAt(i,'otrosIngAcum');
    const r16=r8+r9+r10+r11+r12+r13+r14+r15;
    const r7=prevNom, r17=r7+r16;
    const r18=i<2?cfg.coefEneFeb:cfg.coef;
    const r19=r17*r18;
    const r21=adjAt(i,'ptuMes'); const r22=accPTU+r21;
    const r25=adjAt(i,'anticipRend'); const r26=accAnt+r25;
    const r29=adjAt(i,'remPerdidas'); const r30=accPerd+r29;
    const r32=adjAt(i,'estimDedInmediata'),r34=adjAt(i,'inventarioAcum'),r36=adjAt(i,'dedAdicPrimerEmpleo');
    const r38=r19-r22-r26-r30-r32-r34-r36;
    const r39=cfg.isrRate;
    const r40=r38*r39;
    const r41=adjAt(i,'estimAcreditables'),r42=adjAt(i,'reducciones');
    const r43=r40-r41-r42;
    const r44=maxPer;
    const r46=inversion.filter(x=>getM(x.fecha)===i).reduce((s,x)=>s+num(x.isrRetenido),0);
    const r47=accRet+r46;
    const r49=adjAt(i,'otrasCargo'),r50=adjAt(i,'otrasFavor');
    const r51=Math.max(0,r43-r44-r47+r49-r50);
    const r53=adjAt(i,'iepsAlcohol'),r54=adjAt(i,'impConsolidable'),r55=adjAt(i,'pctConsolidable');

/* ── EDO. CTA. BANCARIO — BANAMEX CHEQUES (replica hoja "EdoCuentaBanamexCheques", extraído de los PDFs ene-may 2026) ── */
const NOFACT_RE=/\b(sat|impuesto|pr[eé]stamo|compensaci[oó]n|invers)/i;
const NOFACT_TIPOS=['SAT','TRASPASO','PRESTAMO'];
const guessSinFactura=c=>NOFACT_RE.test(c||'');
/* Conciliado = único criterio para considerar un Ingreso/Egreso fiscalmente (sustituye al viejo campo Estado) */
const isConciliado=(rec,tipo,banco)=>{
  const field=tipo==='ingreso'?'depositos':'retiros';
  const monto=banco.filter(b=>b.matchTipo===tipo&&b.matchId===rec.id).reduce((s,b)=>s+num(b[field]),0);
  return monto>0&&(num(rec.total)-monto)<=1;
};

function autoEgreso(eg,cfg=TAX_DEF){
  const t=TIPOS[eg.tipo];if(!t)return eg;
  let sub=num(eg.subtotal),iva=num(eg.iva),retISR=0,retIVA=0;
  if(t.iva){if(!sub&&num(eg.importe)){sub=num(eg.importe)/(1+cfg.ivaRate);iva=sub*cfg.ivaRate;}else if(!iva){iva=sub*cfg.ivaRate;}}
  else{sub=num(eg.importe)||sub;iva=0;}
  if(t.retISR)retISR=sub*cfg.retISR;
  if(t.retIVA)retIVA=iva*2/3;
  return{...eg,subtotal:sub,iva,retISR,retIVA,total:num(eg.importe)||sub+iva};
}

  </div>);
}

/* ── XML INGRESOS (facturas CFDI emitidas, con estatus de conciliación contra Ingresos/banco) ── */
const ING_BLANK={fecha:'',concepto:'',rfc:'',banco:'',subtotal:'',iva:'',base0:'',total:'',tasa:'0.16',tipo:'Normal',notas:''};
function TaxXmlIngresos(){
  const {ing,saveIng,banco,saveBanco}=useContext(TaxCtx);
  const [modal,setModal]=useState(null);// null|'add'|{edit record}
  const [form,setForm]=useState(ING_BLANK);
  const [filter,setFilter]=useState('all');
  const [reconcileFor,setReconcileFor]=useState(null);
  const fileRef=useRef();
  const fileRefReplace=useRef();
  const unlinkAll=async id=>{if(window.confirm('¿Desvincular todos los depósitos ligados a esta factura?'))await saveBanco(banco.map(b=>b.matchTipo==='ingreso'&&b.matchId===id?{...b,matchTipo:null,matchId:null}:b));};

  const openAdd=()=>{setForm({...ING_BLANK,fecha:new Date().toISOString().slice(0,10)});setModal('add');};
  const openEdit=r=>{setForm({...r});setModal(r);};
  const close=()=>setModal(null);
  const fch=k=>e=>{
    const v=e.target.value;
    setForm(f=>{
      const nf={...f,[k]:v};
      if(k==='subtotal'&&nf.tasa==='0.16'){nf.iva=(num(v)*0.16).toFixed(2);nf.total=(num(v)*1.16).toFixed(2);}
      if(k==='subtotal'&&nf.tasa!=='0.16'){nf.iva='0.00';nf.total=v;}
      if(k==='tasa'){if(v==='0.16'){nf.iva=(num(f.subtotal)*0.16).toFixed(2);nf.total=(num(f.subtotal)*1.16).toFixed(2);}else{nf.iva='0.00';nf.total=f.subtotal;}}
      return nf;
    });
  };
  const save=async()=>{
    if(!form.fecha||!form.concepto)return alert('Fecha y concepto son requeridos.');
    if(modal==='add'){await saveIng([{id:uid(),...form},...ing]);}
    else{await saveIng(ing.map(r=>r.id===modal.id?{...r,...form}:r));}
    close();
  };
  const del=async id=>{if(window.confirm('¿Eliminar este registro?'))await saveIng(ing.filter(r=>r.id!==id));};
  const readXLS=(file,cb)=>{
    const rdr=new FileReader();
    rdr.onload=ev=>{
      const wb=XLSX.read(ev.target.result,{type:'binary'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
      const mapped=rows
        .filter(r=>{
          const tipo=String(r['Tipo']||''),estado=String(r['Estado']||'');
          if(/P\s*-\s*Pago/i.test(tipo))return false; // excluye complementos de pago
          if(estado&&!/VIGENTE/i.test(estado))return false; // excluye canceladas
          return true;
        })
        .map(r=>{
          const rawSub=num(r['Subtotal']||r['SubTotal']||r['Base']||r['subtotal']||0);
          const ivaAmt=num(r['IVA']||r['IVA Trasladado 16%']||r['Impuesto']||0);
          const sub16=ivaAmt>0?(ivaAmt/0.16):0;
          return{id:uid(),
          fecha:xlsDate(r['Fecha']||r['fecha']||r['Fecha emision']||r['F.Factura']||''),
          concepto:r['Concepto']||r['Conceptos']||r['Descripcion']||r['concepto']||'',
          rfc:r['RFC']||r['RFC Receptor']||r['RFC receptor']||'',
          banco:r['Banco']||r['banco']||'',
          subtotal:sub16,
          iva:ivaAmt,
          base0:Math.max(0,rawSub-sub16),
          total:r['Total']||r['total']||'',
          tasa:'0.16',tipo:'Normal',notas:r['Razon receptor']||r['Notas']||'',
        };})
        .filter(r=>r.fecha&&r.concepto);
      cb(mapped);
    };
    rdr.readAsBinaryString(file);
  };
  const importNew=e=>{
    const file=e.target.files[0];if(!file)return;
    readXLS(file,mapped=>{
      const existing=new Set(ing.map(dupKey));
      const nuevos=mapped.filter(r=>!existing.has(dupKey(r)));
      const dupes=mapped.length-nuevos.length;
      saveIng([...nuevos,...ing]);
      alert(`${nuevos.length} registros nuevos importados.`+(dupes>0?` ${dupes} ya existían y se omitieron.`:''));
    });
    e.target.value='';
  };
  const importReplace=e=>{
    const file=e.target.files[0];if(!file)return;
    if(!window.confirm('Esto eliminará TODOS los registros actuales de XML Ingresos y los sustituirá por los del archivo. Se perderán las conciliaciones ya hechas con Ingresos. ¿Continuar?'))return;
    readXLS(file,mapped=>{
      saveIng(mapped);
      saveBanco(banco.map(b=>b.matchTipo==='ingreso'?{...b,matchTipo:null,matchId:null}:b));
      alert(mapped.length+' registros cargados (se sustituyó todo lo anterior).');
    });
    e.target.value='';
  };
  const concInfo=r=>{
    const linked=banco.filter(b=>b.matchTipo==='ingreso'&&b.matchId===r.id);
    const concMonto=linked.reduce((s,b)=>s+num(b.depositos),0);
    const remanente=num(r.total)-concMonto;
    const status=concMonto<=0.005?'pendiente':remanente>0.5?'parcial':'conciliado';
    return{concMonto,remanente,status};
  };
  const shown=filter==='all'?ing:ing.filter(r=>concInfo(r).status===filter);
  const totSub=shown.reduce((s,r)=>s+num(r.subtotal),0);
  const totIVA=shown.reduce((s,r)=>s+num(r.iva),0);
  const totBase0=shown.reduce((s,r)=>s+num(r.base0),0);
  const totConc=ing.filter(r=>concInfo(r).status==='conciliado').length;
  const totPend=ing.filter(r=>concInfo(r).status==='pendiente').length;
  const totParcial=ing.filter(r=>concInfo(r).status==='parcial').length;
  return(<div>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:14,flexWrap:'wrap',gap:8}}>
      <div className="sec-hdr" style={{marginBottom:0}}><h3>XML Ingresos</h3><p>Facturas CFDI emitidas · su estatus de conciliación se calcula contra tus depósitos reales en la pestaña Ingresos. Solo lo "Conciliado" alimenta los cálculos fiscales.</p></div>
      <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
        <button className="btn-g" style={{fontSize:12,display:'flex',alignItems:'center',gap:5}} title="Agrega solo las facturas del Excel que no existan ya (compara fecha+RFC+total)" onClick={()=>fileRef.current.click()}><Ic n="upload" sz={13}/>Importar solo nuevos</button>
        <input ref={fileRef} type="file" accept=".xlsx,.xls" style={{display:'none'}} onChange={importNew}/>
        <button className="btn-g" style={{fontSize:12,display:'flex',alignItems:'center',gap:5}} title="Elimina todos los registros actuales y los sustituye por los del Excel" onClick={()=>fileRefReplace.current.click()}><Ic n="upload" sz={13}/>Importar reemplazando todo</button>
        <input ref={fileRefReplace} type="file" accept=".xlsx,.xls" style={{display:'none'}} onChange={importReplace}/>
        <button className="btn-p" style={{display:'flex',alignItems:'center',gap:5}} onClick={openAdd}><Ic n="plus" sz={13}/>Agregar</button>
      </div>
    </div>
    <div style={{display:'flex',gap:10,marginBottom:14,flexWrap:'wrap',alignItems:'center'}}>
      {[['all','Todos ('+ing.length+')'],['conciliado','Conciliado ('+totConc+')'],['parcial','Parcial ('+totParcial+')'],['pendiente','Pendiente ('+totPend+')']].map(([v,l])=>(
        <button key={v} onClick={()=>setFilter(v)} style={{fontSize:12,padding:'4px 12px',borderRadius:20,border:`1px solid ${filter===v?'var(--ac)':'var(--br)'}`,background:filter===v?'var(--acb)':'var(--s)',color:filter===v?'var(--ac)':'var(--i2)',fontWeight:500}}>{l}</button>
      ))}
      <span style={{marginLeft:'auto',fontSize:12,color:'var(--i2)'}}>{shown.length} registros · Subtotal: <b>${mxn(totSub)}</b> · IVA: <b>${mxn(totIVA)}</b></span>
    </div>
    {shown.length===0?<div className="ph2-box"><div className="icon">💰</div><h4>Sin ingresos registrados</h4><p>Agrega registros manualmente o importa desde tu Excel de OneFact Emitidas.</p></div>
    :<div className="ovr"><table className="tbl">
      <thead><tr><th>Fecha</th><th>Concepto</th><th>Banco</th><th className="num">Subtotal 16%</th><th className="num">IVA</th><th className="num">Base 0%/Exento</th><th className="num">Total</th><th>Conciliación</th><th></th></tr></thead>
      <tbody>{[...shown].sort((a,b)=>new Date(a.fecha)-new Date(b.fecha)).map(r=>{
        const{remanente,status}=concInfo(r);
        return(
        <tr key={r.id}>
          <td style={{whiteSpace:'nowrap'}}>{r.fecha}</td>
          <td><div style={{fontWeight:500,maxWidth:220,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{r.notas||r.concepto}</div>{r.rfc&&<div style={{fontSize:10.5,color:'var(--i3)',fontFamily:'var(--mono)'}}>{r.rfc}</div>}</td>
          <td style={{fontSize:11.5}}>{r.banco||'—'}</td>
          <td className="num">${mxn(num(r.subtotal))}</td>
          <td className="num">${mxn(num(r.iva))}</td>
          <td className="num" style={{color:num(r.base0)?'var(--p)':'var(--i3)'}}>{num(r.base0)?'$'+mxn(num(r.base0)):'—'}</td>
          <td className="num" style={{fontWeight:500}}>${mxn(num(r.total))}</td>
          <td>{status==='pendiente'?<button className="btn-g" style={{fontSize:11,padding:'3px 8px'}} onClick={()=>setReconcileFor(r)}>Conciliar</button>:status==='parcial'?<span className="badge bd-w" style={{cursor:'pointer'}} title={'Falta $'+mxn(remanente)+' · clic para desvincular'} onClick={()=>unlinkAll(r.id)}>◐ Parcial · ${mxn(remanente)}</span>:<span className="badge bd-g" style={{cursor:'pointer'}} title="Clic para desvincular" onClick={()=>unlinkAll(r.id)}>✓ Conciliado</span>}</td>
          <td><div style={{display:'flex',gap:5}}>
            <button className="btn-g" style={{padding:'4px 8px',fontSize:12}} onClick={()=>openEdit(r)}><Ic n="edit" sz={12}/></button>
            <button className="btn-r" style={{padding:'4px 8px'}} onClick={()=>del(r.id)}><Ic n="trash" sz={12}/></button>
          </div></td>
        </tr>
      );})}</tbody>
      <tfoot><tr style={{background:'#FAFBFC'}}><td colSpan="3" style={{fontWeight:700,fontSize:12}}>Acumulado anual</td><td className="num" style={{fontWeight:700}}>${mxn(totSub)}</td><td className="num" style={{fontWeight:700}}>${mxn(totIVA)}</td><td className="num" style={{fontWeight:700,color:'var(--p)'}}>${mxn(totBase0)}</td><td className="num" style={{fontWeight:700}}>${mxn(shown.reduce((s,r)=>s+num(r.total),0))}</td><td></td><td></td></tr></tfoot>
    </table></div>}
    {reconcileFor&&<XmlReconcileModal tipo="ingreso" item={reconcileFor} onClose={()=>setReconcileFor(null)}/>}
    {modal&&(<div className="modal-bg" onClick={e=>{if(e.target===e.currentTarget)close();}}>
      <div className="modal"><div style={{padding:'18px 20px',borderBottom:'1px solid var(--br)',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <h4 style={{fontWeight:600}}>{modal==='add'?'Nuevo ingreso':'Editar ingreso'}</h4>
        <button style={{background:'none',border:'none',fontSize:20,color:'var(--i3)'}} onClick={close}>×</button>
      </div>
      <div style={{padding:'18px 20px',display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>

          <div key={k} style={k==='concepto'?{gridColumn:'1/-1'}:{}}><label style={{fontSize:11.5,fontWeight:500,display:'block',marginBottom:3}}>{l}</label>

        {[['subtotal','Subtotal 16%'],['iva','IVA (auto)'],['base0','Base 0%/Exento'],['total','Total (auto)']].map(([k,l])=>(

/* ── XML EGRESOS (facturas CFDI recibidas, con estatus de conciliación contra Egresos/banco) ── */
const EG_BLANK={fecha:'',concepto:'',rfc:'',banco:'',tipo:'GASTO_ADM',importe:'',subtotal:'',iva:'',base0:'',retISR:'',retIVA:'',total:'',notas:''};
function TaxXmlEgresos(){
  const {eg,saveEg,cfg,banco,saveBanco}=useContext(TaxCtx);
  const [modal,setModal]=useState(null);
  const [form,setForm]=useState(EG_BLANK);
  const [filter,setFilter]=useState('all');
  const [reconcileFor,setReconcileFor]=useState(null);
  const fileRef=useRef();
  const fileRefReplace=useRef();
  const unlinkAll=async id=>{if(window.confirm('¿Desvincular todos los retiros ligados a esta factura?'))await saveBanco(banco.map(b=>b.matchTipo==='egreso'&&b.matchId===id?{...b,matchTipo:null,matchId:null}:b));};

  const openAdd=()=>{setForm({...EG_BLANK,fecha:new Date().toISOString().slice(0,10)});setModal('add');};
  const openEdit=r=>{setForm({...r});setModal(r);};
  const close=()=>setModal(null);
  const fch=k=>e=>{
    const v=e.target.value;
    setForm(f=>{
      const nf={...f,[k]:v};
      if(k==='tipo'||k==='importe'){
        const updated=autoEgreso({...nf,[k]:v},cfg);
        return{...nf,...updated,tipo:nf.tipo,importe:nf.importe,[k]:v,
          subtotal:updated.subtotal?updated.subtotal.toFixed(2):nf.subtotal,
          iva:updated.iva?updated.iva.toFixed(2):'0.00',
          retISR:updated.retISR?updated.retISR.toFixed(2):'0.00',
          retIVA:updated.retIVA?updated.retIVA.toFixed(2):'0.00',
        };
      }
      return nf;
    });
  };
  const save=async()=>{
    if(!form.fecha||!form.concepto)return alert('Fecha y concepto son requeridos.');
    const rec={...form};
    if(modal==='add'){await saveEg([{id:uid(),...rec},...eg]);}
    else{await saveEg(eg.map(r=>r.id===modal.id?{...r,...rec}:r));}
    close();
  };
  const del=async id=>{if(window.confirm('¿Eliminar este registro?'))await saveEg(eg.filter(r=>r.id!==id));};
  const readXLS=(file,cb)=>{
    const rdr=new FileReader();
    rdr.onload=ev=>{
      const wb=XLSX.read(ev.target.result,{type:'binary'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
      const mapped=rows
        .filter(r=>{
          const tipo=String(r['Tipo']||''),estado=String(r['Estado']||'');
          if(/P\s*-\s*Pago/i.test(tipo))return false; // excluye complementos de pago
          if(estado&&!/VIGENTE/i.test(estado))return false; // excluye canceladas
          return true;
        })
        .map(r=>{
          const retISR=num(r['RET. ISR HONORARIOS']||r['Ret ISR']||r['ISR Retenido']||0);
          const retIVA=num(r['RET. IVA']||r['Ret IVA']||r['IVA Retenido']||0);
          const rawSub=num(r['Subtotal']||r['SubTotal']||r['Gravado']||0);
          const ivaAmt=num(r['IVA']||r['IVA Trasladado 16%']||0);
          const sub16=ivaAmt>0?(ivaAmt/0.16):0;
          return{id:uid(),
            fecha:xlsDate(r['Fecha']||r['fecha']||r['Fecha emision']||''),
            concepto:r['Concepto']||r['Conceptos']||r['Proveedor']||r['Descripcion']||'',
            rfc:r['RFC']||r['RFC emisor']||'',banco:r['Banco']||r['banco']||'',
            tipo:retISR>0?'SERV_PROF':'GASTO_ADM',importe:r['Importe']||r['Total']||'',
            subtotal:sub16,
            iva:ivaAmt,
            base0:Math.max(0,rawSub-sub16),
            retISR:retISR||'',retIVA:retIVA||'',
            total:r['Total']||'',notas:r['Razon emisor']||'',
          };
        })
        .filter(r=>r.fecha&&r.concepto);
      cb(mapped);
    };
    rdr.readAsBinaryString(file);
  };
  const importNew=e=>{
    const file=e.target.files[0];if(!file)return;
    readXLS(file,mapped=>{
      const existing=new Set(eg.map(dupKey));
      const nuevos=mapped.filter(r=>!existing.has(dupKey(r)));
      const dupes=mapped.length-nuevos.length;
      saveEg([...nuevos,...eg]);
      alert(`${nuevos.length} registros nuevos importados.`+(dupes>0?` ${dupes} ya existían y se omitieron.`:''));
    });
    e.target.value='';
  };
  const importReplace=e=>{
    const file=e.target.files[0];if(!file)return;
    if(!window.confirm('Esto eliminará TODOS los registros actuales de XML Egresos y los sustituirá por los del archivo. Se perderán las conciliaciones ya hechas con Egresos. ¿Continuar?'))return;
    readXLS(file,mapped=>{
      saveEg(mapped);
      saveBanco(banco.map(b=>b.matchTipo==='egreso'?{...b,matchTipo:null,matchId:null}:b));
      alert(mapped.length+' registros cargados (se sustituyó todo lo anterior).');
    });
    e.target.value='';
  };
  const concInfo=r=>{
    const linked=banco.filter(b=>b.matchTipo==='egreso'&&b.matchId===r.id);
    const concMonto=linked.reduce((s,b)=>s+num(b.retiros),0);
    const remanente=num(r.total)-concMonto;
    const status=concMonto<=0.005?(NOFACT_TIPOS.includes(r.tipo)?'sinfactura':'pendiente'):remanente>0.5?'parcial':'conciliado';
    return{concMonto,remanente,status};
  };
  const shown=filter==='all'?eg:eg.filter(r=>r.tipo===filter);
  return(<div>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:14,flexWrap:'wrap',gap:8}}>
      <div className="sec-hdr" style={{marginBottom:0}}><h3>XML Egresos</h3><p>Facturas CFDI recibidas · su estatus de conciliación se calcula contra tus retiros reales en la pestaña Egresos. El Tipo determina el tratamiento fiscal automático (IVA, retenciones).</p></div>
      <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
        <button className="btn-g" style={{fontSize:12,display:'flex',alignItems:'center',gap:5}} title="Agrega solo las facturas del Excel que no existan ya (compara fecha+RFC+total)" onClick={()=>fileRef.current.click()}><Ic n="upload" sz={13}/>Importar solo nuevos</button>
        <input ref={fileRef} type="file" accept=".xlsx,.xls" style={{display:'none'}} onChange={importNew}/>
        <button className="btn-g" style={{fontSize:12,display:'flex',alignItems:'center',gap:5}} title="Elimina todos los registros actuales y los sustituye por los del Excel" onClick={()=>fileRefReplace.current.click()}><Ic n="upload" sz={13}/>Importar reemplazando todo</button>
        <input ref={fileRefReplace} type="file" accept=".xlsx,.xls" style={{display:'none'}} onChange={importReplace}/>
        <button className="btn-p" style={{display:'flex',alignItems:'center',gap:5}} onClick={openAdd}><Ic n="plus" sz={13}/>Agregar</button>
      </div>
    </div>
    <div style={{display:'flex',gap:6,marginBottom:14,flexWrap:'wrap'}}>
      <button onClick={()=>setFilter('all')} style={{fontSize:12,padding:'4px 12px',borderRadius:20,border:`1px solid ${filter==='all'?'var(--ac)':'var(--br)'}`,background:filter==='all'?'var(--acb)':'var(--s)',color:filter==='all'?'var(--ac)':'var(--i2)',fontWeight:500}}>Todos ({eg.length})</button>
      {Object.entries(TIPOS).map(([k,t])=>{const n=eg.filter(r=>r.tipo===k).length;return n>0?(<button key={k} onClick={()=>setFilter(k)} style={{fontSize:12,padding:'4px 12px',borderRadius:20,border:`1px solid ${filter===k?'var(--ac)':'var(--br)'}`,background:filter===k?'var(--acb)':'var(--s)',color:filter===k?'var(--ac)':'var(--i2)',fontWeight:500}}>{t.label} ({n})</button>):null;})}
    </div>
    {shown.length===0?<div className="ph2-box"><div className="icon">💸</div><h4>Sin egresos registrados</h4><p>Agrega registros manualmente o importa desde tu Excel de OneFact Egresos. El tipo determinará el tratamiento fiscal automáticamente.</p></div>
    :<div className="ovr"><table className="tbl">
      <thead><tr><th>Fecha</th><th>Concepto/RFC</th><th>Tipo</th><th className="num">Subtotal 16%</th><th className="num">IVA</th><th className="num">Base 0%/Exento</th><th className="num">Ret. ISR</th><th className="num">Ret. IVA</th><th className="num">Total</th><th>Conciliación</th><th></th></tr></thead>
      <tbody>{[...shown].sort((a,b)=>new Date(a.fecha)-new Date(b.fecha)).map(r=>{
        const{remanente,status}=concInfo(r);
        return(
        <tr key={r.id}>
          <td style={{whiteSpace:'nowrap'}}>{r.fecha}</td>
          <td><div style={{fontWeight:500,maxWidth:200,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{r.notas||r.concepto}</div>{r.rfc&&<div style={{fontSize:10.5,color:'var(--i3)',fontFamily:'var(--mono)'}}>{r.rfc}</div>}</td>
          <td><span className={'badge '+(r.tipo==='SERV_PROF'||r.tipo==='ARRENDAMIENTO'?'bd-w':r.tipo==='SAT'?'bd-r':'bd-p')}>{TIPOS[r.tipo]?.label||r.tipo}</span></td>
          <td className="num">{num(r.subtotal)?'$'+mxn(num(r.subtotal)):'—'}</td>
          <td className="num">{num(r.iva)?'$'+mxn(num(r.iva)):'—'}</td>
          <td className="num" style={{color:num(r.base0)?'var(--p)':'var(--i3)'}}>{num(r.base0)?'$'+mxn(num(r.base0)):'—'}</td>
          <td className="num" style={{color:num(r.retISR)?'var(--r)':'var(--i3)'}}>{num(r.retISR)?'$'+mxn(num(r.retISR)):'—'}</td>
          <td className="num" style={{color:num(r.retIVA)?'var(--r)':'var(--i3)'}}>{num(r.retIVA)?'$'+mxn(num(r.retIVA)):'—'}</td>
          <td className="num" style={{fontWeight:500}}>${mxn(num(r.total))}</td>
          <td>{status==='sinfactura'?<span className="badge bd-p">Sin factura</span>:status==='pendiente'?<button className="btn-g" style={{fontSize:11,padding:'3px 8px'}} onClick={()=>setReconcileFor(r)}>Conciliar</button>:status==='parcial'?<span className="badge bd-w" style={{cursor:'pointer'}} title={'Falta $'+mxn(remanente)+' · clic para desvincular'} onClick={()=>unlinkAll(r.id)}>◐ Parcial · ${mxn(remanente)}</span>:<span className="badge bd-g" style={{cursor:'pointer'}} title="Clic para desvincular" onClick={()=>unlinkAll(r.id)}>✓ Conciliado</span>}</td>
          <td><div style={{display:'flex',gap:5}}>
            <button className="btn-g" style={{padding:'4px 8px',fontSize:12}} onClick={()=>openEdit(r)}><Ic n="edit" sz={12}/></button>
            <button className="btn-r" style={{padding:'4px 8px'}} onClick={()=>del(r.id)}><Ic n="trash" sz={12}/></button>
          </div></td>
        </tr>
      );})}</tbody>
      <tfoot><tr style={{background:'#FAFBFC'}}><td colSpan="3" style={{fontWeight:700,fontSize:12}}>Acumulado anual</td><td className="num" style={{fontWeight:700}}>${mxn(shown.reduce((s,r)=>s+num(r.subtotal),0))}</td><td className="num" style={{fontWeight:700}}>${mxn(shown.reduce((s,r)=>s+num(r.iva),0))}</td><td className="num" style={{fontWeight:700,color:'var(--p)'}}>${mxn(shown.reduce((s,r)=>s+num(r.base0),0))}</td><td className="num" style={{fontWeight:700,color:'var(--r)'}}>${mxn(shown.reduce((s,r)=>s+num(r.retISR),0))}</td><td className="num" style={{fontWeight:700,color:'var(--r)'}}>${mxn(shown.reduce((s,r)=>s+num(r.retIVA),0))}</td><td className="num" style={{fontWeight:700}}>${mxn(shown.reduce((s,r)=>s+num(r.total),0))}</td><td></td><td></td></tr></tfoot>
    </table></div>}
    {reconcileFor&&<XmlReconcileModal tipo="egreso" item={reconcileFor} onClose={()=>setReconcileFor(null)}/>}
    {modal&&(<div className="modal-bg" onClick={e=>{if(e.target===e.currentTarget)close();}}>
      <div className="modal"><div style={{padding:'18px 20px',borderBottom:'1px solid var(--br)',display:'flex',justifyContent:'space-between'}}>
        <h4 style={{fontWeight:600}}>{modal==='add'?'Nuevo egreso':'Editar egreso'}</h4>
        <button style={{background:'none',border:'none',fontSize:20,color:'var(--i3)'}} onClick={close}>×</button>
      </div>
      <div style={{padding:'18px 20px',display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
        {[['fecha','Fecha','date'],['concepto','Concepto','text'],['rfc','RFC','text'],['banco','Banco','text']].map(([k,l,t])=>(
          <div key={k} style={k==='concepto'?{gridColumn:'1/-1'}:{}}><label style={{fontSize:11.5,fontWeight:500,display:'block',marginBottom:3}}>{l}</label>
            <input className="inp" type={t} value={form[k]||''} onChange={fch(k)}/></div>
        ))}
        <div style={{gridColumn:'1/-1'}}><label style={{fontSize:11.5,fontWeight:500,display:'block',marginBottom:3}}>Tipo <span style={{fontWeight:400,color:'var(--i3)'}}>(determina ISR/IVA automáticamente)</span></label>
          <select className="inp" value={form.tipo} onChange={fch('tipo')}>{Object.entries(TIPOS).map(([k,t])=><option key={k} value={k}>{t.label} {t.retISR?'· Ret. ISR 10%':''}{t.retIVA?' · Ret. IVA 2/3':''}{!t.iva&&k!=='SAT'?' · Sin IVA':''}{k==='SAT'?' · Sin impuestos':''}</option>)}</select></div>
        <div><label style={{fontSize:11.5,fontWeight:500,display:'block',marginBottom:3}}>Importe total pagado</label>
          <input className="inp" type="number" step="0.01" value={form.importe||''} onChange={fch('importe')}/></div>
        {[['subtotal','Subtotal 16% (auto)'],['iva','IVA (auto)'],['base0','Base 0%/Exento'],['retISR','Ret. ISR (auto)'],['retIVA','Ret. IVA (auto)']].map(([k,l])=>(
          <div key={k}><label style={{fontSize:11.5,fontWeight:500,display:'block',marginBottom:3}}>{l}</label>
            <input className="inp" type="number" step="0.01" value={form[k]||''} onChange={fch(k)} style={{background:'#FAFBFC'}}/></div>
        ))}
        <div style={{gridColumn:'1/-1'}}><label style={{fontSize:11.5,fontWeight:500,display:'block',marginBottom:3}}>Notas</label>
          <input className="inp" type="text" value={form.notas||''} onChange={fch('notas')}/></div>
      </div>
      <div style={{padding:'0 20px 18px',display:'flex',gap:8}}><button className="btn-p" onClick={save}>Guardar</button><button className="btn-g" onClick={close}>Cancelar</button></div>
    </div></div>)}
  </div>);
}

/* ── DETALLE IVA / ISR A FAVOR ── */
function FavorTable({tipo}){
  const ctx=useContext(TaxCtx);
  const isIVA=tipo==='iva';
  const data=isIVA?ctx.ivaFav:ctx.isrFav;
  const save=isIVA?ctx.saveIvaFav:ctx.saveIsrFav;
  const MN=MESES;
  const [modal,setModal]=useState(null);
  const blank=isIVA
    ?{anio:'2025',mes:'',tipo:'Normal',operacion:'',fechaPresentacion:'',saldoFavor:'',acreditamientos:{}}
    :{anio:'2025',tipo:'Normal',operacion:'',fechaPresentacion:'',saldoFavor:'',acreditamientos:{}};
  const [form,setForm]=useState(blank);
  const openAdd=()=>{setForm(blank);setModal('add');};
  const openEdit=r=>{setForm({...r,acreditamientos:{...r.acreditamientos}});setModal(r);};
  const close=()=>setModal(null);
  const totalAcred=r=>Object.values(r.acreditamientos||{}).reduce((s,v)=>s+num(v),0);
  const disponible=r=>num(r.saldoFavor)+totalAcred(r); // acreditamientos son negativos
  const saveRec=async()=>{
    if(!form.saldoFavor)return alert('Captura el saldo a favor.');
    if(modal==='add'){await save([...data,{id:uid(),...form,saldoFavor:num(form.saldoFavor)}]);}
    else{await save(data.map(x=>x.id===modal.id?{...form,saldoFavor:num(form.saldoFavor)}:x));}
    close();
  };
  const del=async id=>{if(window.confirm('¿Eliminar registro?'))await save(data.filter(x=>x.id!==id));};
  const totSaldo=data.reduce((s,r)=>s+num(r.saldoFavor),0);
  const totAcred=data.reduce((s,r)=>s+totalAcred(r),0);
  const totDisp=data.reduce((s,r)=>s+disponible(r),0);
  return(<div>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:14,flexWrap:'wrap',gap:8}}>
      <div className="sec-hdr" style={{marginBottom:0}}><h3>Detalle {isIVA?'IVA':'ISR'} a Favor</h3><p>Saldos a favor de {isIVA?'IVA':'ISR'} con acreditamientos mensuales y remanente disponible.</p></div>
      <button className="btn-p" style={{display:'flex',alignItems:'center',gap:5}} onClick={openAdd}><Ic n="plus" sz={13}/>Agregar saldo</button>
    </div>
    <div className="kpi-grid">
      <div className="kpi"><p>Saldo a favor total</p><p>${mxn(totSaldo)}</p></div>
      <div className="kpi"><p>Acreditamientos aplicados</p><p style={{color:'var(--r)'}}>${mxn(totAcred)}</p></div>
      <div className="kpi"><p>Disponible (remanente)</p><p style={{color:'var(--g)'}}>${mxn(totDisp)}</p></div>
    </div>
    {data.length===0?<div className="ph2-box"><div className="icon">✅</div><h4>Sin saldos a favor</h4><p>Agrega tus saldos a favor históricos con el botón de arriba.</p></div>
    :<div className="ovr" style={{maxHeight:'72vh'}}><table className="tbl" style={{fontSize:11.5}}>
      <thead><tr>
        <th style={{position:'sticky',left:0,zIndex:2,background:'var(--s1)',minWidth:70}}>Año</th>
        {isIVA&&<th style={{minWidth:90}}>Mes</th>}
        <th style={{minWidth:110}}>Tipo</th>
        <th style={{minWidth:120}}>No. Operación</th>
        <th style={{minWidth:90}}>Fecha Pres.</th>
        <th className="num" style={{minWidth:110,borderRight:'2px solid var(--brs)'}}>Saldo a Favor</th>
        {MN.map(m=><th key={m} className="num" style={{minWidth:72}}>{m.slice(0,3)}</th>)}
        <th className="num" style={{minWidth:110,borderLeft:'2px solid var(--brs)',color:'var(--ac)'}}>Disponible</th>
        <th style={{minWidth:80}}></th>
      </tr></thead>
      <tbody>{data.map(r=>(
        <tr key={r.id}>
          <td style={{position:'sticky',left:0,zIndex:1,background:'var(--s)',fontWeight:600}}>{r.anio}</td>
          {isIVA&&<td>{r.mes}</td>}
          <td><span className="badge bd-b">{r.tipo}</span></td>
          <td style={{fontFamily:'var(--mono)',fontSize:11}}>{r.operacion||'—'}</td>
          <td style={{fontSize:11.5}}>{r.fechaPresentacion||'—'}</td>
          <td className="num" style={{fontWeight:600,borderRight:'2px solid var(--br)'}}>${mxn(num(r.saldoFavor))}</td>
          {MN.map(m=><td key={m} className="num" style={{color:r.acreditamientos&&r.acreditamientos[m]?'var(--r)':'var(--i3)'}}>{r.acreditamientos&&r.acreditamientos[m]?mxn(num(r.acreditamientos[m])):'—'}</td>)}
          <td className="num" style={{fontWeight:700,borderLeft:'2px solid var(--br)',color:disponible(r)>0?'var(--g)':'var(--i3)'}}>${mxn(disponible(r))}</td>
          <td><div style={{display:'flex',gap:5}}><button className="btn-g" style={{padding:'4px 8px'}} onClick={()=>openEdit(r)}><Ic n="edit" sz={12}/></button><button className="btn-r" style={{padding:'4px 8px'}} onClick={()=>del(r.id)}><Ic n="trash" sz={12}/></button></div></td>
        </tr>
      ))}</tbody>
      <tfoot><tr style={{background:'var(--acb)'}}>
        <td style={{position:'sticky',left:0,zIndex:1,background:'var(--acb)',fontWeight:700}} colSpan={isIVA?5:4}>Totales</td>
        <td className="num" style={{fontWeight:700,borderRight:'2px solid var(--acs)'}}>${mxn(totSaldo)}</td>
        {MN.map(m=><td key={m} className="num" style={{fontWeight:600,color:'var(--r)'}}>{mxn(data.reduce((s,r)=>s+num(r.acreditamientos&&r.acreditamientos[m]),0))}</td>)}
        <td className="num" style={{fontWeight:700,borderLeft:'2px solid var(--acs)',color:'var(--g)'}}>${mxn(totDisp)}</td>
        <td></td>
      </tr></tfoot>

    rdr.onload=ev=>{
      const wb=XLSX.read(ev.target.result,{type:'binary'});

        return{id:uid(),
          fecha:xlsDate(r['Fecha']||r['fecha']||''),
          concepto,
          retiros:num(r['Retiros']||r['retiros']||0),
          depositos:num(r['Depositos']||r['Depósitos']||r['depositos']||0),
          sinFactura:guessSinFactura(concepto),
        };
      }).filter(r=>r.fecha&&(r.retiros>0||r.depositos>0));
      const existing=new Set(banco.map(bankDupKey));
      const nuevos=mapped.filter(r=>!existing.has(bankDupKey(r)));
      const dupes=mapped.length-nuevos.length;
      saveBanco([...nuevos,...banco]);
      alert(`${nuevos.length} movimientos nuevos importados.`+(dupes>0?` ${dupes} ya existían y se omitieron.`:''));
    };
    rdr.readAsBinaryString(file);
    e.target.value='';

      <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
        <button className="btn-g" style={{fontSize:12,display:'flex',alignItems:'center',gap:5}} title="Carga un Excel con columnas Fecha, Concepto, Retiros, Depósitos — reparte automáticamente entre Ingresos y Egresos. No importa desde cuál pestaña lo subas." onClick={()=>fileRef.current.click()}><Ic n="upload" sz={13}/>Importar estado de cuenta</button>
        <input ref={fileRef} type="file" accept=".xlsx,.xls" style={{display:'none'}} onChange={importXLS}/>
        <button className="btn-p" style={{display:'flex',alignItems:'center',gap:5}} onClick={openAdd}><Ic n="plus" sz={13}/>Agregar</button>

    </div>

          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'9px 14px',background:has?'var(--acb)':'var(--s1)',borderBottom:has?'1px solid var(--acs)':'1px solid var(--br)'}}>
            <span style={{fontWeight:700,fontSize:13,color:has?'var(--ac)':'var(--i2)'}}>{mes.toUpperCase()} 2026{has&&<span style={{marginLeft:8,fontWeight:500,fontSize:11,color:'var(--i3)'}}>· {recs.length} movimientos</span>}</span>
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              {has&&<span style={{fontSize:12,fontFamily:'var(--mono)',color}}>${mxn(mTot)}</span>}
              <button className="btn-g" style={{padding:'3px 9px',fontSize:11,display:'flex',alignItems:'center',gap:4}} onClick={()=>openAddForMonth(i)}><Ic n="plus" sz={11}/>Agregar</button>

          {!has

            :<table className="tbl">
              <thead><tr><th style={{fontSize:10,minWidth:64}}>Fecha</th><th style={{fontSize:10}}>Concepto</th><th className="num" style={{fontSize:10}}>{isIng?'Depósitos':'Retiros'}</th><th></th></tr></thead>
              <tbody>{recs.map(r=>(
                <tr key={r.id}><td style={{whiteSpace:'nowrap'}}>{r.fecha}</td><td>{r.concepto}</td>

                </tr>

            </table>}
        </div>);
      })}
    </div>
    {modal&&(<div className="modal-bg" onClick={e=>{if(e.target===e.currentTarget)close();}}>
      <div className="modal" style={{maxWidth:460}}><div style={{padding:'18px 20px',borderBottom:'1px solid var(--br)',display:'flex',justifyContent:'space-between'}}><h4 style={{fontWeight:600}}>{modal==='add'?'Nuevo movimiento':'Editar movimiento'}</h4><button style={{background:'none',border:'none',fontSize:20,color:'var(--i3)'}} onClick={close}>×</button></div>
      <div style={{padding:'18px 20px',display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
        <div><label style={{fontSize:11.5,fontWeight:500,display:'block',marginBottom:3}}>Fecha</label><input className="inp" type="date" value={form.fecha||''} onChange={e=>setForm({...form,fecha:e.target.value})}/></div>
        <div><label style={{fontSize:11.5,fontWeight:500,display:'block',marginBottom:3}}>{isIng?'Depósito':'Retiro'}</label><input className="inp" type="number" step="0.01" value={form[field]||''} onChange={e=>setForm({...form,[field]:e.target.value})}/></div>
        <div style={{gridColumn:'1/-1'}}><label style={{fontSize:11.5,fontWeight:500,display:'block',marginBottom:3}}>Concepto</label><input className="inp" value={form.concepto||''} onChange={e=>setForm({...form,concepto:e.target.value})}/></div>

      <div style={{padding:'0 20px 18px',display:'flex',gap:8}}><button className="btn-p" onClick={saveRec}>Guardar</button><button className="btn-g" onClick={close}>Cancelar</button></div>
    </div></div>)}
  </div>);
}

function XmlReconcileModal({tipo,item,onClose}){
  const {banco,saveBanco}=useContext(TaxCtx);
  const [allMonths,setAllMonths]=useState(false);
  const field=tipo==='ingreso'?'depositos':'retiros';
  const monthIdx=getM(item.fecha);
  const isComision=/comisi/i.test(item.concepto||'');
  const targetMonth=isComision&&monthIdx<11?monthIdx+1:monthIdx;
  const linkedSum=banco.filter(b=>b.matchTipo===tipo&&b.matchId===item.id).reduce((s,b)=>s+num(b[field]),0);
  const remaining=num(item.total)-linkedSum;
  const cands=banco.filter(b=>!b.matchId&&num(b[field])>0&&(allMonths||getM(b.fecha)===targetMonth))
    .map(b=>({b,diff:Math.abs(num(b[field])-remaining)}))
    .sort((a,b)=>a.diff-b.diff);
  const link=async bancoId=>{await saveBanco(banco.map(b=>b.id===bancoId?{...b,matchTipo:tipo,matchId:item.id}:b));onClose();};
  return(<div className="modal-bg" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
    <div className="modal" style={{maxWidth:620}}>
      <div style={{padding:'18px 20px',borderBottom:'1px solid var(--br)',display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
        <div><h4 style={{fontWeight:600,marginBottom:3}}>Conciliar factura</h4><p style={{fontSize:12,color:'var(--i2)'}}>{item.fecha} · {item.notas||item.concepto} · Falta <b>${mxn(remaining)}</b> ({tipo==='ingreso'?'→ Ingresos (depósito)':'→ Egresos (retiro)'})</p></div>
        <button style={{background:'none',border:'none',fontSize:20,color:'var(--i3)'}} onClick={onClose}>×</button>
      </div>
      <div style={{padding:'12px 20px 0'}}>
        <label style={{fontSize:12,color:'var(--i2)',display:'flex',alignItems:'center',gap:6}}><input type="checkbox" checked={allMonths} onChange={e=>setAllMonths(e.target.checked)}/>Buscar en todos los meses (por defecto solo busca en {MESES[targetMonth]}{isComision&&' — mes siguiente, las comisiones bancarias se devengan un mes antes de que el banco las cobre'})</label>
      </div>
      <div style={{padding:'12px 20px 18px',maxHeight:'50vh',overflowY:'auto',display:'flex',flexDirection:'column',gap:6}}>
        {cands.length===0?<p style={{fontSize:12.5,color:'var(--i3)'}}>No hay movimientos de {tipo==='ingreso'?'Ingresos':'Egresos'} sin conciliar en este periodo.</p>
        :cands.map(({b,diff})=>(
          <div key={b.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:10,padding:'8px 10px',borderRadius:8,border:'1px solid var(--br)'}}>
            <div style={{minWidth:0}}>
              <div style={{fontSize:12.5,fontWeight:500,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{b.concepto}</div>
              <div style={{fontSize:11,color:'var(--i3)'}}>{b.fecha} · ${mxn(num(b[field]))} {diff<0.02&&<span className="badge bd-g" style={{marginLeft:6}}>Monto exacto</span>}</div>
            </div>
            <button className="btn-p" style={{fontSize:12,padding:'5px 12px',flexShrink:0}} onClick={()=>link(b.id)}>Vincular</button>
          </div>
        ))}
      </div>
    </div>
  </div>);
}

  {id:'ivafav', label:'Detalle IVA a Favor',  phase:1},
  {id:'isrfav', label:'Detalle ISR a Favor',  phase:1},
  {id:'inver',  label:'Edo. Cta. Inversión',  phase:1},
  {id:'ing',    label:'Ingresos',             phase:1},
  {id:'eg',     label:'Egresos',              phase:1},
  {id:'xml_ing',label:'XML Ingresos',         phase:1},
  {id:'xml_eg', label:'XML Egresos',          phase:1},
];

function ImpuestosApp(){
  const [sec,setSec]=useState('dash');
  const {ready,companyName}=useContext(TaxCtx);
  const render=()=>{
    if(sec==='dash') return <TaxDashboard/>;
    if(sec==='isr')  return <TaxISR/>;
    if(sec==='iva')  return <TaxIVA/>;
    if(sec==='ret_isr') return <TaxRetISR/>;
    if(sec==='ret_iva') return <TaxRetIVA/>;
    if(sec==='ing')  return <TaxIngresos/>;
    if(sec==='eg')   return <TaxEgresos/>;
    if(sec==='xml_ing') return <TaxXmlIngresos/>;
    if(sec==='xml_eg')  return <TaxXmlEgresos/>;
    if(sec==='ivafav') return <FavorTable tipo="iva"/>;
    if(sec==='isrfav') return <FavorTable tipo="isr"/>;
    if(sec==='inver')  return <TaxInversion/>;
    return null;
  };
  if(!ready)return <div style={{padding:32,color:'var(--i3)'}}>Cargando datos fiscales…</div>;
  return(<div style={{display:'flex',gap:0,height:'100%'}}>
    <div className="tsb">
      <p style={{fontSize:10,fontWeight:700,letterSpacing:.8,color:'var(--i3)',textTransform:'uppercase',padding:'4px 9px 8px'}}>{companyName}</p>
      {TAX_SECS.map(s=>(
        <button key={s.id} className={'tni'+(sec===s.id?' on':'')} onClick={()=>setSec(s.id)}>
          <span style={{width:6,height:6,borderRadius:'50%',background:s.phase===2?'var(--br)':'var(--ac)',flexShrink:0}}/>
          {s.label}
          {s.phase===2&&<span style={{marginLeft:'auto',fontSize:9,color:'var(--i3)'}}>F2</span>}
        </button>
      ))}
    </div>
    <div style={{flex:1,minWidth:0,padding:'20px 18px',overflowY:'auto'}}>{render()}</div>
  </div>);
}
function Impuestos({companyId,companyName}){return(<TaxProvider companyId={companyId} companyName={companyName}><ImpuestosApp/></TaxProvider>);}

/* ── WORKSPACE (Papel de Trabajo Impuestos → selector de empresas) ── */
function Workspace(){
  const [companies,setCompanies]=useState([]);
  const [activeId,setActiveId]=useState(null);
  const [expanded,setExpanded]=useState(true);
  const [creating,setCreating]=useState(false);
  const [newName,setNewName]=useState('');
  useEffect(()=>{(async()=>{
    const {data:{user}}=await sb.auth.getUser();
    if(!user)return;
    const {data}=await sb.from('companies').select('*').eq('user_id',user.id).order('created_at');
    const list=data||[];
    setCompanies(list);
    if(list.length===1)setActiveId(list[0].id);
  })();},[]);
  const createCompany=async e=>{
    e.preventDefault();
    const nombre=newName.trim();
    if(!nombre)return;
    const {data:{user}}=await sb.auth.getUser();
    const {data,error}=await sb.from('companies').insert({user_id:user.id,nombre}).select().single();
    if(!error&&data){
      setCompanies(cs=>[...cs,data]);
      setActiveId(data.id);
      setCreating(false);
      setNewName('');
    }
  };
  const active=companies.find(c=>c.id===activeId);
  return(<div className="app">
    <nav className="sb" aria-label="Módulos">
      <div style={{padding:'2px 10px 12px'}}><p style={{fontSize:14,fontWeight:600,color:'var(--ac)'}}>Workspace Martin Rendon</p></div>
      <div style={{display:'flex',alignItems:'center',gap:9,padding:'8px 10px 2px',fontSize:13,fontWeight:600,color:'var(--i2)'}}><Ic n="tax"/>Papel de Trabajo Impuestos</div>
      <button className="ni" style={{paddingLeft:28}} onClick={()=>setExpanded(x=>!x)}>
        <span style={{width:12,display:'inline-block'}}>{expanded?'▾':'▸'}</span>Empresa
      </button>
      {expanded&&(<div style={{paddingLeft:28,display:'flex',flexDirection:'column',gap:2,marginBottom:6}}>
        {companies.map(c=>(<button key={c.id} className={'tni'+(activeId===c.id?' on':'')} onClick={()=>setActiveId(c.id)}>{c.nombre}</button>))}
        {!creating
          ? <button className="tni" onClick={()=>setCreating(true)}><Ic n="plus"/>Crear nueva base de datos</button>
          : <form onSubmit={createCompany} style={{display:'flex',flexDirection:'column',gap:6,padding:'6px 9px'}}>
              <input className="inp" autoFocus placeholder="Nombre de la empresa" value={newName} onChange={e=>setNewName(e.target.value)} required/>
              <div style={{display:'flex',gap:6}}>
                <button className="btn-p" style={{fontSize:11.5,padding:'6px 10px'}}>Crear</button>
                <button type="button" className="btn-g" style={{fontSize:11.5,padding:'6px 10px'}} onClick={()=>{setCreating(false);setNewName('');}}>Cancelar</button>
              </div>
            </form>}
      </div>)}
      <button className="btn-g" style={{marginTop:'auto',fontSize:11.5}} onClick={()=>sb.auth.signOut()}>Cerrar sesión</button>
    </nav>
    <main className="cnt">
      {active
        ?<div style={{display:'flex',height:'100%',minHeight:'100vh'}}><Impuestos companyId={active.id} companyName={active.nombre}/></div>
        :<div style={{padding:32,color:'var(--i2)'}}>Selecciona o crea una empresa en "Empresa" para empezar su papel de trabajo de Impuestos.</div>}
    </main>
  </div>);
}

/* ── LOGIN ── */
function Login(){
  const [email,setEmail]=useState('');
  const [pw,setPw]=useState('');
  const [err,setErr]=useState('');
  const [busy,setBusy]=useState(false);
  const submit=async e=>{
    e.preventDefault();setBusy(true);setErr('');
    const {error}=await sb.auth.signInWithPassword({email,password:pw});
    setBusy(false);
    if(error)setErr(error.message);
  };
  return(<div style={{display:'flex',minHeight:'100vh',alignItems:'center',justifyContent:'center'}}>
    <form onSubmit={submit} className="card" style={{width:320,display:'flex',flexDirection:'column',gap:12}}>
      <h3>Workspace contable — Impuestos</h3>
      {err&&<p style={{color:'var(--r)',fontSize:12.5}}>{err}</p>}
      <input className="inp" type="email" placeholder="Correo" value={email} onChange={e=>setEmail(e.target.value)} required/>
      <input className="inp" type="password" placeholder="Contraseña" value={pw} onChange={e=>setPw(e.target.value)} required/>
      <button className="btn-p" disabled={busy}>{busy?'Entrando…':'Entrar'}</button>
    </form>
  </div>);
}
function AuthGate(){
  const [session,setSession]=useState(undefined);
  useEffect(()=>{
    sb.auth.getSession().then(({data})=>setSession(data.session));
    const {data:sub}=sb.auth.onAuthStateChange((_e,s)=>setSession(s));
    return ()=>sub.subscription.unsubscribe();
  },[]);
  if(session===undefined)return <div style={{padding:32,color:'var(--i3)'}}>Cargando…</div>;
  if(!session)return <Login/>;
  return <Workspace/>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<AuthGate/>);
</script>
